<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Web</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <fieldset class="fieldheader">
            <div>
                <a href="menu.html" class="botaoinicio">
                    <img src="imagens/Delivery-Web.png" alt="Logo Delivery Web" class="logo">
                    <h1>Delivery <br> Web</h1>
                </a>
            </div>
            <div class="busca">
                <form action="#">
                    <label for="buscar"></label>
                    <input type="text" placeholder="  Buscar produtos..." id="buscar" name="busca">
                </form>
            </div>
            <div>
                <a href="login.html" class="botaologin">Entrar</a>
            </div>
            <div>
                <a href="carrinho.html" class="botaocarrinho">
                    <img src="imagens/carrinho.png" alt="Icone carrinho" class="iconecarrinho">
                </a> 
            </div>
        </fieldset>
    </header>

    <div class="principal">
        <div class="categorias">
            <button type="submit" id="botaolanches" class="botaocategoria">
                <p>Lanches</p>
            </button>
            <button type="submit" id="botaomarmita" class="botaocategoria">
                <p>Marmita</p>
            </button>
            <button type="submit" id="botaoveganos" class="botaocategoria">
                <p>Veganos</p>
            </button>
            <button type="submit" id="botaobebidas" class="botaocategoria">
                <p>Bebidas</p>
            </button>
            <button type="submit" id="botaopromocoes" class="botaocategoria">
                <p>Promoções</p>
            </button>
        </div>
        <div class="avaliacoes">
            <div id="produtoavaliacoes">
                <h2>Avalie este produto</h2>
                <fieldset id="xisavaliacao">
                        <div class="textoproduto">
                            <h2>Hambúrguer</h2> 
                            <p>Hambúrguer de carne</p>
                            <strong><p>R$35,00</p></strong>
                        </div>
                        <img src="imagens/xis.jpeg" alt="Imagem do Hambúrguer" class="imagemcarrinho">
                </fieldset>
            </div>
            <div id="telaavaliacoes">
                <fieldset id="telaavaliacao">
                    <h2>Avaliação</h2>
                    <div id="gostou">
                        <p>Gostou?</p> 
                        <img src="imagens/estrelas.webp" alt="Imagem das estrelas" id="imagemavaliacao">
                    </div>
                    <div>
                        <p>Diga-nos a sua opinião: </p>
                        <textarea name="comentarios" id="comentarios" placeholder="Avaliação..."></textarea>
                        <input type="submit" value="Enviar" id="enviaravaliacao" class="botao">
                        <input type="reset" name="apagar" id="apagaravaliacao" value="Apagar" class="botao">
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
        <footer>
            <fieldset class="fieldfooter">
                <p>© Copyright 2026 - Todos os direitos abertos Henrique Gama e Luisa Blankenburg</p>
                <button type="submit" class="botaofooter">Termos e condições de uso</button>
                <button type="submit" class="botaofooter">Privacidade</button>
                <button type="submit" class="botaofooter">Contato</button>
            </fieldset>
        </footer>
</body>
</html>
