<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Web</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <fieldset class="fieldheader">
            <div class="logo">
                <a href="menu.html" class="botaoinicio"><h1>Delivery <br> Web</h1></a>
            </div>
            <div class="busca">
                <form action="#">
                    <label for="buscar"></label>
                    <input type="text" placeholder="  Buscar produtos..." id="buscar" name="busca">
                </form>
            </div>
            <div>
                <a href="login.html"><input type="button" class="botaologin" name="botao" id="botaologin" value="Entrar"></a>
            </div>
            <div>
                <button type="submit" class="botaocarrinho">
                    <img src="imagens/carrinho.png" alt="Icone carrinho" class="iconecarrinho">
                </button>
            </div>
        </fieldset>
    </header>
    <div class="principal">
        <div class="categorias">
            <button type="submit" id="botaolanches" class="botaocategoria">
                <p>Lanches</p>
            </button>
            <button type="submit" id="botaomarmita" class="botaocategoria">
                <p>Marmita</p>
            </button>
            <button type="submit" id="botaoveganos" class="botaocategoria">
                <p>Veganos</p>
            </button>
            <button type="submit" id="botaobebidas" class="botaocategoria">
                <p>Bebidas</p>
            </button>
            <button type="submit" id="botaopromocoes" class="botaocategoria">
                <p>Promoções</p>
            </button>
        </div>
        <div class="anuncios">
            <div class="anuncioslanches">
                <h2>Lanches</h2>
                <button type="submit" id="botaoxis" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/xis.jpeg" alt="Imagem Xis" class="imagensanuncios">
                        <p>Hambúrguer</p>
                        <strong><p>R$35,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaohotdog" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/hotdog.jpeg" alt="Imagem HotDog" class="imagensanuncios">
                        <p>Cachorro Quente</p>
                        <strong><p>R$20,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaopizza" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/pizza.jpeg" alt="Imagem Pizza" class="imagensanuncios">
                        <p>Pizza</p>
                        <strong><p>R$80,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaopastel" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/pastel.avif" alt="Imagem Pastel" class="imagensanuncios">
                        <p>Pastel</p>
                        <strong><p>R$18,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaofritas" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/batata--frita.jpeg" alt="Imagem Porção de Fritas" class="imagensanuncios">
                        <p>Porção de Fritas</p>
                        <strong><p>R$30,00</p></strong>
                    </fieldset>
                </button>
            </div>
            <div class="anunciosmarmitas">
                <h2>Marmitas</h2>
                <button type="submit" id="botaostrogonoff" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/strogonoff.avif" alt="Imagem Strogonoff" class="imagensanuncios">
                        <p>Strogonoff</p>
                        <strong><p>R$25,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaofrango" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/frango.webp" alt="Imagem Frango" class="imagensanuncios">
                        <p>Frango</p>
                        <strong><p>R$20,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaoalmondegas" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/almondegas.avif" alt="Imagem Almôndegas com espaguete" class="imagensanuncios">
                        <p>Almôndegas de frango</p>
                        <strong><p>R$30,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaoespaguete" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/espaguete.webp" alt="Imagem Espaguete Bolonhesa" class="imagensanuncios">
                        <p>Espaguete Bolonhesa</p>
                        <strong><p>R$25,00</p></strong>
                    </fieldset>
                </button>
                <button type="submit" id="botaopeixe" class="botaoanuncios">
                    <fieldset class="fieldanuncio">
                        <img src="imagens/peixe.jpg" alt="Imagem Peixe" class="imagensanuncios">
                        <p>Peixe</p>
                        <strong><p>R$20,00</p></strong>
                    </fieldset>
                </button>
            </div>
        </div>
    </div>
    <footer>
        <fieldset class="fieldfooter">
            <p>© Copyright 2026 - Todos os direitos abertos Henrique Gama e Luisa Blankenburg</p>
            <button type="submit" class="botaofooter">
                <p>Termos e condições de uso</p>
            </button>
            <button type="submit" class="botaofooter">
                <p>Privacidade</p>
            </button>
            <button type="submit" class="botaofooter">
                <p>Contato</p>
            </button>
        </fieldset>
    </footer>
</body>
</html>
