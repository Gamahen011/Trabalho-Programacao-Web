<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Web</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <fieldset class="fieldheader">
            <div>
                <a href="menu.html" class="botaoinicio">
                    <img src="imagens/Delivery-Web.png" alt="Logo Delivery Web" class="logo">
                    <h1>Delivery <br> Web</h1>
                </a>
            </div>
            <div class="busca">
                <form action="#">
                    <label for="buscar"></label>
                    <input type="text" placeholder="  Buscar produtos..." id="buscar" name="busca">
                </form>
            </div>
            <div>
                <a href="login.html" class="botaologin">Entrar</a>
            </div>
            <div>
                <a href="carrinho.html" class="botaocarrinho">
                    <img src="imagens/carrinho.png" alt="Icone carrinho" class="iconecarrinho">
                </a> 
            </div>
        </fieldset>
    </header>

    <div>
        <fieldset class="fieldcadastro">
            <h2>Tela de cadastro</h2>
            <form action="#">
                <label for="name">Nome:</label> 
                <input type="text" id="name" required> <br>

                <label for="login">Login:</label> 
                <input type="text" id="login" required> <br>

                <label for="senha">Senha:</label>
                <input type="text" id="senha" required>
                <br>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="00000000000" maxlength="11" required>
                <br>
                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" required> <br> <br>

                <button type="submit" value="Enviar" class="botao">Cadastrar</button>
                <button type="reset" value="Apagar" class="botao">Apagar</button>

                <p id="escolherlogin">Já possui conta? <a href="login.html">Clique aqui</a></p>
            </form>
        </fieldset>
    </div>

    <footer>
        <fieldset class="fieldfooter">
            <p>© Copyright 2026 - Todos os direitos abertos Henrique Gama e Luisa Blankenburg</p>
            <button type="submit" class="botaofooter">Termos e condições de uso</button>
            <button type="submit" class="botaofooter">Privacidade</button>
            <button type="submit" class="botaofooter">Contato</button>
        </fieldset>
    </footer>

</body>
</html>
